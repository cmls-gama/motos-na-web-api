name: Motos-na-Web-API-CI

#[script de pipeline] YAML

# [gatilhos] (manual, agendada, quando houver mudanças, etc.)
on:
  workflow_dispatch:

  pull_request:
    branches:
      - main

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-tests:
  # [config do sistema operacional] (mac/windows/linux/etc)
    name: Testes automatizados da API
    runs-on: ubuntu-latest
    timeout-minutes: 10
  # [variaveis] (de ambiente, chaves de acesso)
    env:
      BASE_URL: http://localhost:3000
      PORT: '3000'
      JWT_SECRET: ci-only-secret-not-for-production
      JWT_EXPIRES_IN: 1h
      MANAGER_USERNAME: gerente
      MANAGER_PASSWORD: gerente123
      USER_USERNAME: usuario
      USER_PASSWORD: usuario123

    steps:
    # [projetos] (aplicacoes FE/BE, apps, projetos de testes, etc)
      - name: Clonar o projeto
        uses: actions/checkout@v6
    # [dependencias do projeto] (node/npm, java/maven, python/pip)
      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependências
        run: npm ci
     # [acoes para verificar regras/políticas] (cobertura de código, formatacao, testes ui/e2e/unit/etc.)
      - name: Iniciar a API e aguardar disponibilidade
        shell: bash
        run: |
          npm start > server.log 2>&1 &

          for tentativa in {1..30}; do
            if curl --fail --silent "$BASE_URL/health" > /dev/null; then
              echo "API disponível em $BASE_URL"
              exit 0
            fi

            sleep 1
          done

          echo "A API não ficou disponível no tempo esperado."
          cat server.log
          exit 1

      - name: Executar os testes da API
        run: npm test

      - name: Publicar relatório dos testes
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: relatorio-mochawesome
          path: |
            mochawesome-report/
            server.log
          if-no-files-found: warn
          retention-days: 7
